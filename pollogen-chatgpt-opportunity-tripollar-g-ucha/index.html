  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +

ttle proof of what works, and beauty and medical devices fall under OpenAI's health restrictions, which block these ads in most countries outside the US. In practice, that rules out Geneo's markets and leaves TriPollar with, at most, a small US test if the team wants to try it.<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #0A0A0E; text-wrap: pretty\">Where we do see value is in organic visibility: making sure ChatGPT mentions Geneo and TriPollar when people ask about devices. That's part of our GEO work.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"margin-top: 56px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: #6B6B7B\">/01<\u002Fdiv>\n<h2 style=\"margin: 6px 0 14px; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.2; color: #0A0A0E\">What ChatGPT ads are <em style=\"font-weight: 400\">today<\u002Fem><\u002Fh2>\n<p style=\"margin: 0 0 20px; text-wrap: pretty\">OpenAI started showing ads in February 2026. The platform has grown quickly since then, but it's still in an early testing stage.<\u002Fp>\n<sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.5\">\n<sc-raw-thead>\n<sc-raw-tr>\n<sc-raw-th style=\"text-align: left; width: 34%; padding: 10px 16px 10px 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6B7B; border-bottom: 1.5px solid #0A0A0E\">Topic<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align: left; padding: 10px 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6B7B; border-bottom: 1.5px solid #0A0A0E\">Where it stands (Nov 2026)<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 16px 12px 0; font-weight: 700; color: #0A0A0E; vertical-align: top; border-bottom: 1px solid rgba(10,10,14,0.16)\">Ad format<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; border-bottom: 1px solid rgba(10,10,14,0.16)\">A sponsored card shown below ChatGPT's answer<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 16px 12px 0; font-weight: 700; color: #0A0A0E; vertical-align: top; border-bottom: 1px solid rgba(10,10,14,0.16)\">Who sees ads<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; border-bottom: 1px solid rgba(10,10,14,0.16)\">Only users on the Free and Go plans. Paid and business accounts see no ads<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 16px 12px 0; font-weight: 700; color: #0A0A0E; vertical-align: top; border-bottom: 1px solid rgba(10,10,14,0.16)\">Markets<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; border-bottom: 1px solid rgba(10,10,14,0.16)\">Self-serve in about 63 countries, including the US, UK, all EU countries, Canada, Australia and India<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 16px 12px 0; font-weight: 700; color: #0A0A0E; vertical-align: top; border-bottom: 1px solid rgba(10,10,14,0.16)\">Buying<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; border-bottom: 1px solid rgba(10,10,14,0.16)\">Self-serve Ads Manager, no minimum spend, CPC or CPM bidding<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 16px 12px 0; font-weight: 700; color: #0A0A0E; vertical-align: top; border-bottom: 1px solid rgba(10,10,14,0.16)\">Targeting<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; border-bottom: 1px solid rgba(10,10,14,0.16)\">Based on the topic of the conversation. No keyword, age, interest or job title targeting<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 16px 12px 0; font-weight: 700; color: #0A0A0E; vertical-align: top; border-bottom: 1px solid rgba(10,10,14,0.16)\">Cost<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; border-bottom: 1px solid rgba(10,10,14,0.16)\">Suggested starting bids of $3 to $5 per click. Advertisers report $3 to $22<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 16px 12px 0; font-weight: 700; color: #0A0A0E; vertical-align: top; border-bottom: 1px solid rgba(10,10,14,0.16)\">Performance<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; border-bottom: 1px solid rgba(10,10,14,0.16)\">Around 0.9% CTR vs about 6.4% for Google search ads. OpenAI shares no official benchmarks yet<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 16px 12px 0; font-weight: 700; color: #0A0A0E; vertical-align: top; border-bottom: 1px solid rgba(10,10,14,0.16)\">Health and beauty devices<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; border-bottom: 1px solid rgba(10,10,14,0.16)\"><strong style=\"color: #4D3FC9\">Restricted.<\u002Fstrong> Outside the US, health ads are generally not allowed. In the US, some categories (consumer medical devices, minimally invasive cosmetic procedures) are approved case by case, with no medical claims<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<p style=\"margin: 18px 0 0; font-size: 13px; line-height: 1.6; color: #4A4A55; text-wrap: pretty\">OpenAI has already changed its ad policies several times this year, so these rules could still change. Sources: <a href=\"https://openai.com/policies/ad-policies/\">OpenAI ad policies<\u002Fa>, <a href=\"https://www.searchenginejournal.com/6-months-into-chatgpt-ads-advertisers-still-dont-know-what-good-looks-like/587583/\">Search Engine Journal<\u002Fa>, <a href=\"https://www.curvecompliance.com/healthcare-ads-ai-assistants-platform-rules\">Curve Compliance<\u002Fa>, <a href=\"https://trucommerce.ai/insights/chatgpt-ads-benchmarks-2026\">Tru Commerce<\u002Fa>, <a href=\"https://spilnoagency.com.ua/en/instructions-us/chatgpt-advertising-how-to-launch-2026\">Spilno<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"margin-top: 56px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: #6B6B7B\">/02<\u002Fdiv>\n<h2 style=\"margin: 6px 0 14px; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.2; color: #0A0A0E\">What it means for <em style=\"font-weight: 400\">TriPollar<\u002Fem><\u002Fh2>\n<p style=\"margin: 0 0 20px; text-wrap: pretty\">Of the two brands, TriPollar is the one that could make sense, but only for a small test in the US. People are already asking ChatGPT things like \"what is the best at-home RF device for my skin\", and that's where a TriPollar ad could show up.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 20px; background: #FFFFFF; border: 1px solid rgba(10,10,14,0.08); border-radius: 16px\"><span style=\"flex: 0 0 auto; margin-top: 2px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #00745F; background: #E0F8F3; border-radius: 999px; padding: 3px 10px\">US<\u002Fspan><p style=\"margin: 0; text-wrap: pretty\">It could work, as long as OpenAI approves TriPollar as a beauty device. The ads couldn't include any medical or clinical claims.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 20px; background: #FFFFFF; border: 1px solid rgba(10,10,14,0.08); border-radius: 16px\"><span style=\"flex: 0 0 auto; margin-top: 2px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #A33A3A; background: #FFECEC; border-radius: 999px; padding: 3px 10px\">UK · Spain<\u002Fspan><p style=\"margin: 0; text-wrap: pretty\">Most likely not possible, since OpenAI generally doesn't allow health and device ads outside the US.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 20px; background: #FFFFFF; border: 1px solid rgba(10,10,14,0.08); border-radius: 16px\"><span style=\"flex: 0 0 auto; margin-top: 2px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #4D3FC9; background: #EFEDFE; border-radius: 999px; padding: 3px 10px\">Keep in mind<\u002Fspan><p style=\"margin: 0; text-wrap: pretty\">With a low CTR and no benchmarks yet, a test would help us learn, but we can't promise sales or any specific results. We'd also need a US landing page, because ChatGPT ads send people to a link and we need that page to track results with the OpenAI pixel.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top: 56px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: #6B6B7B\">/03<\u002Fdiv>\n<h2 style=\"margin: 6px 0 14px; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.2; color: #0A0A0E\">What it means for <em style=\"font-weight: 400\">Geneo<\u002Fem><\u002Fh2>\n<p style=\"margin: 0 0 20px; text-wrap: pretty\">For Geneo, paid ChatGPT ads don't make sense right now, for a few reasons:<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px\">\n<div style=\"padding: 18px 18px 20px; background: #FFFFFF; border: 1px solid rgba(10,10,14,0.08); border-radius: 16px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #4D3FC9; margin-bottom: 8px\">Markets<\u002Fdiv><p style=\"margin: 0; font-size: 14px; line-height: 1.55; text-wrap: pretty\">All of Geneo's active markets (Belgium, Netherlands, Australia, India and Canada) are outside the US, where health and beauty device ads are generally not allowed.<\u002Fp><\u002Fdiv>\n<div style=\"padding: 18px 18px 20px; background: #FFFFFF; border: 1px solid rgba(10,10,14,0.08); border-radius: 16px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #4D3FC9; margin-bottom: 8px\">Audience<\u002Fdiv><p style=\"margin: 0; font-size: 14px; line-height: 1.55; text-wrap: pretty\">We can't target clinics or estheticians, and many professionals use paid or business ChatGPT accounts, where ads don't show.<\u002Fp><\u002Fdiv>\n<div style=\"padding: 18px 18px 20px; background: #FFFFFF; border: 1px solid rgba(10,10,14,0.08); border-radius: 16px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #4D3FC9; margin-bottom: 8px\">Category<\u002Fdiv><p style=\"margin: 0; font-size: 14px; line-height: 1.55; text-wrap: pretty\">Professional aesthetic devices are restricted, even in the US.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 20px 0 0; text-wrap: pretty\">Organic is a different conversation. One of our GEO goals for this project is for Geneo to show up when someone asks ChatGPT for a professional aesthetic device company or a device partner. We work toward that through content and SEO.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"margin-top: 56px; background: #0A0A0E; color: #EDEDF2; border-radius: 16px; padding: 36px 36px 32px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: #A8A8B5\">/04<\u002Fdiv>\n<h2 style=\"margin: 6px 0 14px; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.2; color: #FAFAF7\">Our <em style=\"font-weight: 400; color: #00D4B4\">recommendation<\u002Fem><\u002Fh2>\n<p style=\"margin: 0 0 24px; color: #D5D5DE; text-wrap: pretty\">So, our recommendation is to focus on showing up in ChatGPT organically and leave paid ads aside for now. If the team still wants to try paid, we can run a small TriPollar test in the US.<\u002Fp>\n<div style=\"display: flex; flex-direction: column\">\n<div style=\"display: flex; gap: 20px; padding: 18px 0; border-top: 1px solid rgba(255,255,255,0.14)\"><div style=\"flex: 0 0 44px; font-family: Fraunces, Georgia, serif; font-size: 26px; line-height: 1; color: #00D4B4\">01<\u002Fdiv><p style=\"margin: 0; color: #D5D5DE; text-wrap: pretty\"><strong style=\"color: #FAFAF7\">Geneo:<\u002Fstrong> no paid ChatGPT budget for now. We keep working on GEO so ChatGPT mentions Geneo when people look for professional devices or partners, and we track this every month.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 20px; padding: 18px 0; border-top: 1px solid rgba(255,255,255,0.14)\"><div style=\"flex: 0 0 44px; font-family: Fraunces, Georgia, serif; font-size: 26px; line-height: 1; color: #00D4B4\">02<\u002Fdiv><p style=\"margin: 0; color: #D5D5DE; text-wrap: pretty\"><strong style=\"color: #FAFAF7\">TriPollar:<\u002Fstrong> not something we'd prioritize, but if the team wants to test it, the first step is checking with OpenAI that TriPollar can advertise in the US. If they approve it, a 4 to 6 week test with about $2,000 (roughly 500 clicks at a $4 CPC) would tell us if there's real interest before we invest more.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 20px; padding: 18px 0 0; border-top: 1px solid rgba(255,255,255,0.14)\"><div style=\"flex: 0 0 44px; font-family: Fraunces, Georgia, serif; font-size: 26px; line-height: 1; color: #00D4B4\">03<\u002Fdiv><p style=\"margin: 0; color: #D5D5DE; text-wrap: pretty\"><strong style=\"color: #FAFAF7\">Review again in 2027:<\u002Fstrong> OpenAI keeps updating these policies, so more markets or categories may open up next year.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top: 40px; padding-top: 16px; border-top: 1px solid rgba(10,10,14,0.16); display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6B7B\">\n<span>Noetic Creative<\u002Fspan><span>noetic.io<\u002Fspan>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:794,&quot;height&quot;:3150}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
